[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aure"
version = "0.9.0"
description = "Thin film reflectivity sample builder with neural network foundation model"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Oak Ridge National Laboratory" }]

dependencies = [
  # Core science stack
  "numpy>=1.24",
  "scipy>=1.10",
  "refl1d>=1.0",
  # Web UI (aure serve)
  "flask>=3.0",
  # CLI + config parsing
  "click>=8.0",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  # LLM calls (orchestration is a hand-written state machine, not a framework)
  "langchain>=1.0",
  "langchain-openai>=1.0",
  "langchain-google-genai>=2.0.0",
  # MCP server (aure mcp-server)
  "fastmcp>=2.0",
  # Science helpers
  "periodictable>=2.0",
  "regex>=2023.0.0",
  # Plotting (aure plot-results)
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
export = [
  "nr-isaac-format @ git+https://github.com/isaac-neutrons/nr-isaac-format.git",
]
all = ["aure[dev,export]"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["aure*"]

[tool.setuptools.package-data]
"aure.web" = ["templates/**/*", "static/**/*"]
# The skill directories hold no __init__.py, so `packages.find` does not carry
# them and their SKILL.md files are absent from a built wheel or sdist. That is
# invisible under `pip install -e .` but breaks every non-editable install --
# including the Docker image -- leaving SkillRegistry empty and silently
# stripping all domain knowledge from prompts.
# tests/test_packaging.py builds a wheel and asserts these are present.
"aure.skills" = ["*/SKILL.md", "*/references/*", "*/assets/*", "*/scripts/*"]

[project.scripts]
aure = "aure.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=aure --cov-report=term-missing --cov-report=html:htmlcov"

[tool.coverage.run]
source = ["src/aure"]
omit = ["src/aure/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.",
  "if TYPE_CHECKING:",
]
