# ──────────────────────────────────────────────────────────────
# AuRE – batch manifest
# Each entry under "jobs" is one analysis run.
# Copy this file, edit the values, then run:
#
#   aure batch manifest.yaml
#
# All paths are relative to the manifest file's directory unless
# they are absolute.
#
# Every job declares its data files inside a `states:` block.
# Even single-file analyses have one state — there is no flat
# `data_file:` shortcut at the YAML layer (use the `aure analyze
# DATA_FILE` CLI positional for ad-hoc single-file runs).
# ──────────────────────────────────────────────────────────────

# ── Shared defaults (applied to every job unless overridden) ──
defaults:
  command: analyze            # analyze | prepare
  max_refinements: 5          # max refinement iterations per job
  output_root: ./output       # each job writes to <output_root>/<job name>
  verbose: true               # stream progress to stderr
  json: false                 # emit results as JSON instead of pretty output

  # Fitting parameters (override .env / environment)
  fit_method: dream           # lm | de | dream
  fit_steps: 1000
  fit_burn: 1000

  # LLM overrides (optional – normally read from .env)
  # llm_provider: openai
  # llm_model: gpt-4o
  # llm_temperature: 0.0
  # llm_timeout: 120

  # ALCF inference endpoints (when llm_provider: alcf)
  # alcf_cluster: sophia          # sophia | metis
  # alcf_access_token: ...        # Globus token

# ── Jobs ──────────────────────────────────────────────────────
jobs:
  # Simplest job: one file, one state.
  - name: copper_on_silicon
    sample_description: >-
      50 nm copper on 5 nm Ti on silicon.
      The ambient medium is dTHF (SLD about 6).
      Neutrons enter from the silicon substrate side.
    hypothesis: The copper layer may have roughness > 10 Å
    states:
      - name: state0
        data_files:
          - file: tests/data/REFL_218386_combined_data_auto.txt

  # Single-state co-refinement: multiple Q-range segments of one sample.
  # All structural parameters are tied across files (single Sample);
  # each probe gets its own intensity normalisation.
  - name: copper_corefinement
    sample_description: >-
      50 nm copper on 5 nm Ti on silicon.
      The ambient medium is dTHF (SLD about 6).
    max_refinements: 5
    states:
      - name: state0
        data_files:
          - file: data/REFL_218386.txt
          - file: data/REFL_218387.txt
          - file: data/REFL_218388.txt

  # Multi-state co-refinement: one sample, several physical states.
  # Use either `shared_parameters:` (whitelist) OR `unshared_parameters:`
  # (blacklist), not both. When neither is given, the default tied set is
  # used (all layer thicknesses, SLDs, interfaces + substrate.interface).
  - name: cu_d2o_h2o_corefinement
    sample_description: >-
      2 nm CuOx / 50 nm Cu / 3 nm Ti on Si.
    max_refinements: 5
    states:
      - name: D2O
        extra_description: ambient is D2O (SLD ~6.4)
        data_files:
          - file: data/REFL_226642_combined_data_auto.txt
      - name: H2O
        extra_description: ambient is H2O (SLD ~-0.56)
        data_files:
          - file: data/REFL_226660_combined_data_auto.txt
    shared_parameters:
      - Cu.thickness
      - Cu.material.rho
      - Cu.interface
      - Ti.thickness
      - Ti.material.rho
      - Ti.interface

  - name: polystyrene_film
    sample_description: 100 nm polystyrene on silicon
    max_refinements: 3          # override the default for this job
    states:
      - name: state0
        data_files:
          - file: data/ps_film.txt

  # Minimal job: just one data file + description.
  - name: quick_test
    sample_description: thin gold film on glass
    fit_method: lm              # fast local fit only
    fit_steps: 500
    states:
      - name: state0
        data_files:
          - file: data/sample.txt

  # Prepare-only job: generates <output_root>/<name>/<model_name>.json
  - name: ps_prepare_only
    command: prepare
    sample_description: 100 nm polystyrene on silicon
    model_name: ps_model
    states:
      - name: state0
        data_files:
          - file: data/ps_film.txt
          - file: data/ps_film_repeat.txt
