# ==========================================================================
# AuRE setup file (states-only, single run)
# ==========================================================================
#
# A "setup" YAML describes ONE analysis run. Pass it to the CLI with:
#
#   aure analyze -c setup.yaml -o ./output
#
# Or use the same file with batch (treated as a one-job manifest):
#
#   aure batch setup.yaml
#
# The web UI's Setup tab has Load / Save buttons that read and write this
# format, but the form is not a full editor for it — Save silently drops the keys
# it has no field for, chi2_max / chi2_min among them (see issues.md #15). Edit a
# curated setup here, not through the web form.
#
# Every field below is optional unless noted. Paths are resolved relative
# to this file's directory.

# --------------------------------------------------------------------------
# Identification (optional; defaults to "job0" / file stem)
# --------------------------------------------------------------------------
# name: cu_d2o_h2o          # used to name the output subdirectory
# model_name: cu_d2o_h2o    # used for the generated problem.json
#
# command: analyze          # analyze (default) | prepare
# output_root: ./output     # parent directory for the output

# --------------------------------------------------------------------------
# Sample description (required)
# --------------------------------------------------------------------------
sample_description: |
  50 nm copper on 5 nm Ti on silicon.
  The ambient medium is dTHF (SLD about 6).
  Neutrons enter from the silicon substrate side.

# Optional: a hypothesis to bias the LLM's refinement loop toward.
# hypothesis: The copper layer may have a CuOx skin.

# --------------------------------------------------------------------------
# Data (required, always via states)
# --------------------------------------------------------------------------
# Optional: the directory that relative `data_files` paths below resolve
# against. Search order: this directory -> this file's directory -> the
# current directory. Use it when the YAML lists bare filenames but the data
# lives elsewhere (e.g. analyzer `plan-data` output kept in plan/ with the
# data one level up). A relative value resolves against this file's directory;
# the CLI `--data-dir` flag overrides it. Load-time hint only -- never written
# back when a setup is saved.
# data_dir: ../Rawdata
#
# Each state groups data files that share one physical sample / Sample.
# A single-file analysis is one state with one file. A multi-Q-segment
# co-refinement is one state with N files. A solvent-contrast / anneal /
# swelling series is N states (one per physical condition).
#
states:
  - name: state0
    data_files:
      - file: tests/data/REFL_218386_combined_data_auto.txt

# Example: multi-Q-segment co-refinement (single sample, multiple files).
# states:
#   - name: state0
#     data_files:
#       - file: low-Q.dat
#       - file: mid-Q.dat
#       - file: high-Q.dat

# Example: solvent-contrast multi-state co-refinement.
# states:
#   - name: D2O
#     extra_description: ambient is D2O (SLD ~6.4)
#     data_files:
#       - file: Rawdata/REFL_226642_combined_data_auto.txt
#   - name: H2O
#     extra_description: ambient is H2O (SLD ~-0.56)
#     data_files:
#       - file: Rawdata/REFL_226660_combined_data_auto.txt
#
# # Optional per-state overrides — add any of these under a state, alongside
# # `extra_description` (all optional):
# #   ambient: {rho: 6.4}            # ambient SLD for this state
# #   back_reflection: true          # neutrons enter from the substrate side
# #   intensity: {init: 1.0, min: 0.9, max: 1.1}
# #   background: true               # one fittable flat background tied across this
# #                                  # state's data (true => init 1e-6, range 0..1e-5)
# #   theta_offset: true             # partials-only; true => init 0, range +/-0.02
# #   sample_broadening: true        # partials-only; true => init 0, max 0.05
#
# # All states must share the same orientation — mixing normal and back-
# # reflecting states in one run would silently mis-alias substrate.interface.
#
# # Cross-state ties — whitelist OR blacklist (not both). Default tied set
# # (when omitted): every layer's thickness / material.rho / interface and
# # the substrate's interface.
# shared_parameters:
#   - Cu.thickness
#   - Cu.material.rho
#   - Cu.interface
#   - Ti.thickness
#   - Ti.material.rho
#   - Ti.interface
# # unshared_parameters: [CuOx.thickness]

# --------------------------------------------------------------------------
# Refinement controls (optional)
# --------------------------------------------------------------------------
# max_refinements: 5          # default 5
#
# χ² acceptance threshold — the refinement loop's stop condition, enforced in
# code rather than left to the evaluator LLM. A finite χ² at or below it is
# accepted and the loop STOPS immediately; the structural hypotheses never tried
# are reported instead (in the `aure analyze` report, `aure batch`'s per-job
# output, `--json`, and the finalize message in final_state.json). Tighten it to
# buy more refinement, loosen it to stop sooner. Overrides CHI2_MAX from the
# shell / .env for this run only, and is restored afterwards. χ² does NOT force
# acceptance when the SLD-profile artifact check found a non-physical excursion
# (back to refinement), when that check could not verify the profile — none was
# exported, the detector declined it, or the fit is MULTI-STATE, since only
# states[0]'s profile is read back, which makes this key inert on a `states:` run
# (see issues.md #5) — or when a per-file/per-state χ² is over the threshold on
# its own. In each of those the LLM's verdict decides, as before. `aure evaluate`
# applies no stop at all: its `acceptable` is advice, not the stop decision.
# The value is pinned into every checkpoint the run writes, so `aure resume` keeps
# it and ignores the CHI2_MAX of the resuming shell.
# chi2_max: 2.5               # default 5.0 (CHI2_MAX; .env.example ships 2.5)
#
# Lower bound of the same acceptance window. Below it the deterministic stop
# stands down — as it does on an unverified SLD profile — and the evaluator LLM's
# verdict decides; the floor is NOT a veto, so a genuinely good fit whose dR
# really is conservative can still be accepted. Why it exists: a reduced χ² far
# below 1 means the residuals are much smaller than the quoted uncertainties,
# which in reflectometry is almost always an overestimated dR column or a model
# with enough free parameters to absorb the noise — evidence about the ERROR BARS,
# not about the structure, so it must not read as a pass. The default 0.5 is the
# same number the built-in heuristic already calls "Possible overfitting". Use 0
# to disable it; otherwise it must be finite, >= 0 and strictly less than
# `chi2_max` (a setup pinning both is rejected at load time if it is not).
# Pinned into the run state like `chi2_max`, so `aure resume` inherits it.
# chi2_min: 0.5               # default 0.5 (CHI2_MIN; 0 disables the floor)
#
# fit_method: dream           # lm | de | dream  (exploration / refinement loop)
# fit_steps: 1000
# fit_burn: 1000
#
# Optional final uncertainty fit. Explore fast with `fit_method` (e.g. amoeba),
# then run ONE MCMC fit on the finalize-selected model to get proper 1σ error
# bars. Off unless `fit_method_final` is set and differs from `fit_method`.
# Give it a much larger budget than exploration — a small step count yields
# plausible-looking but meaningless uncertainties. Skipped when the selected χ²
# is above the gate (`final_fit_chi2_max`, default = `chi2_max`): no point
# characterizing a poor fit. See docs/finalization.md.
# fit_method_final: dream     # lm | de | dream  (final polish only)
# fit_steps_final: 10000      # default 10000
# fit_burn_final: 10000       # default = fit_steps_final
# final_fit_chi2_max: 1.5     # default = the chi2_max acceptance threshold

# --------------------------------------------------------------------------
# Evaluation criteria  (extra rules the LLM applies when judging the fit)
# --------------------------------------------------------------------------
evaluation_criteria:
  - Layer roughness must be above 5 Å to be considered acceptable.
  - Layer roughness should be below half of adjacent layer thicknesses to avoid unphysical intermixing.

# --------------------------------------------------------------------------
# Model constraints  (hard rules the LLM must respect when building models)
# --------------------------------------------------------------------------
model_constraints:
  - Do not add an extra layer between the copper and titanium layers.
  - If you add an SiOx layer on top of the silicon substrate, do not allow its thickness to exceed 35 Å.
  - The substrate roughness must not exceed 10 Å.

# --------------------------------------------------------------------------
# Pass-through metadata (ignored by AuRE; preserved on round-trip)
# --------------------------------------------------------------------------
# Useful for analyzer interop — e.g. `plan-data` emits `perform_assembly`
# and `notes` here for downstream schedulers to consume.
#
# metadata:
#   perform_assembly: true
#   notes: |
#     Sequence 226642 is complete (3 parts present).
