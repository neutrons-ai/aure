<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 1000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="1660" height="1000" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="800" y="48" text-anchor="middle" font-size="30" font-weight="700" fill="#0f172a">modeling · how the LLM refines the model definition (JSON)</text>
  <text x="800" y="78" text-anchor="middle" font-size="16" fill="#475569">In the refinement loop, the evaluator's verdict + current <tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#0f172a">ModelDefinition</tspan> → LLM JSON edit → a new model handed back to fitting</text>

  <!-- Initial-build side note (no LLM) -->
  <g transform="translate(1130, 95)">
    <rect width="480" height="46" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="#475569">First pass (not shown): no LLM</text>
    <text x="14" y="36" font-size="11" fill="#64748b"><tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace">_build_initial_model()</tspan> assembles the model from parsed_sample + features</text>
  </g>

  <!-- ============================================================ -->
  <!-- Column 1: PROMPT SLOTS                                        -->
  <!-- ============================================================ -->
  <text x="50" y="165" font-size="14" font-weight="700" fill="#64748b" letter-spacing="2">PROMPT SLOTS  (computed inside _refine_model)</text>

  <!-- current model -->
  <g transform="translate(50, 180)">
    <rect width="340" height="120" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
    <rect width="340" height="32" rx="10" fill="#3b82f6"/>
    <rect y="22" width="340" height="10" fill="#3b82f6"/>
    <text x="16" y="22" font-size="13" font-weight="700" fill="#ffffff">current_model  (ModelDefinition)</text>
    <text x="16" y="54" font-size="11" fill="#334155">previous JSON model, with latest fit</text>
    <text x="16" y="70" font-size="11" fill="#334155">values folded in via</text>
    <text x="16" y="86" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#0f172a">_apply_fitted_values_to_definition()</text>
    <text x="16" y="104" font-size="10" fill="#64748b">fitted_* fields stripped before prompting</text>
  </g>

  <!-- latest fit result -->
  <g transform="translate(50, 310)">
    <rect width="340" height="116" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
    <rect width="340" height="32" rx="10" fill="#16a34a"/>
    <rect y="22" width="340" height="10" fill="#16a34a"/>
    <text x="16" y="22" font-size="13" font-weight="700" fill="#ffffff">latest fit  ·  fit_results[-1]</text>
    <text x="16" y="54" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#0f172a">chi_squared, method, converged</text>
    <text x="16" y="70" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#0f172a">parameters</text>
    <text x="16" y="86" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#0f172a">issues, suggestions  (from evaluation)</text>
    <text x="16" y="104" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#0f172a">residual_analysis</text>
  </g>

  <!-- description + features + skills -->
  <g transform="translate(50, 436)">
    <rect width="340" height="100" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
    <rect width="340" height="32" rx="10" fill="#d97706"/>
    <rect y="22" width="340" height="10" fill="#d97706"/>
    <text x="16" y="22" font-size="13" font-weight="700" fill="#ffffff">description · features · skills</text>
    <text x="16" y="54" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#0f172a">sample_description</text>
    <text x="16" y="70" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#0f172a">extracted_features  (Qc, thickness…)</text>
    <text x="16" y="86" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#0f172a">skill_context  (active skills)</text>
  </g>

  <!-- evaluator signals -->
  <g transform="translate(50, 546)">
    <rect width="340" height="120" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
    <rect width="340" height="32" rx="10" fill="#7c3aed"/>
    <rect y="22" width="340" height="10" fill="#7c3aed"/>
    <text x="16" y="22" font-size="13" font-weight="700" fill="#ffffff">EVALUATOR'S CHOSEN NEXT ACTION</text>
    <text x="16" y="54" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#0f172a">next_action</text>
    <text x="26" y="68" font-size="10" fill="#64748b">parameter_tweak | structural_change</text>
    <text x="16" y="86" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#0f172a">proposed_hypothesis_id</text>
    <text x="16" y="104" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#0f172a">structural_hypotheses[]</text>
  </g>

  <!-- user feedback note -->
  <g transform="translate(50, 676)">
    <rect width="340" height="92" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="2" filter="url(#shadow)"/>
    <rect width="340" height="32" rx="10" fill="#db2777"/>
    <rect y="22" width="340" height="10" fill="#db2777"/>
    <text x="16" y="22" font-size="13" font-weight="700" fill="#ffffff">user_constraints · user_feedback</text>
    <text x="16" y="54" font-size="11" fill="#334155">from user_config and the interactive</text>
    <text x="16" y="70" font-size="11" fill="#334155">session (pending_user_feedback) —</text>
    <text x="16" y="86" font-size="11" font-weight="700" fill="#9d174d">authoritative: overrides every rule</text>
  </g>

  <!-- arrows: slots -> prompt -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <line x1="390" y1="240" x2="540" y2="330" marker-end="url(#arrow-light)"/>
    <line x1="390" y1="368" x2="540" y2="410" marker-end="url(#arrow-light)"/>
    <line x1="390" y1="486" x2="540" y2="490" marker-end="url(#arrow-light)"/>
    <line x1="390" y1="606" x2="540" y2="560" marker-end="url(#arrow-light)"/>
    <line x1="390" y1="722" x2="540" y2="630" marker-end="url(#arrow-light)"/>
  </g>

  <!-- ============================================================ -->
  <!-- Column 2: PROMPT TEMPLATE                                     -->
  <!-- ============================================================ -->
  <text x="550" y="165" font-size="14" font-weight="700" fill="#64748b" letter-spacing="2">MODEL_REFINEMENT_JSON_PROMPT  (format_model_refinement_prompt_json)</text>

  <g transform="translate(550, 180)">
    <rect width="540" height="640" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
    <rect width="540" height="32" rx="10" fill="#334155"/>
    <rect y="22" width="540" height="10" fill="#334155"/>
    <text x="16" y="22" font-size="13" font-weight="700" fill="#ffffff">HumanMessage  (single message, no SystemMessage)</text>

    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11">
      <text x="16" y="54" fill="#0f172a">"You are refining a neutron reflectivity</text>
      <text x="16" y="68" fill="#0f172a"> model that did not fit well enough."</text>

      <text x="16" y="92" fill="#334155">## Domain Knowledge</text>
      <text x="26" y="106" fill="#d97706">{skill_context}</text>

      <text x="16" y="128" fill="#334155">## Sample Description</text>
      <text x="26" y="142" fill="#0f172a">{sample_description}</text>

      <text x="16" y="164" fill="#334155">## Current Model (JSON)</text>
      <text x="26" y="178" fill="#3b82f6">{current_model_json}</text>

      <text x="16" y="200" fill="#334155">## Fit Results  ·  ## Best-fit Parameters</text>
      <text x="26" y="214" fill="#16a34a">χ²={chi_squared}  method  converged  {parameters}</text>

      <text x="16" y="236" fill="#334155">## Issues  ·  ## Suggestions</text>
      <text x="26" y="250" fill="#16a34a">{issues}   {suggestions}</text>

      <text x="16" y="272" fill="#334155">## Physics Features  ·  ## Residual Fringes</text>
      <text x="26" y="286" fill="#d97706">{features}   {residual_analysis}</text>

      <text x="16" y="308" fill="#334155">## Ranked Structural Hypotheses</text>
      <text x="26" y="322" fill="#7c3aed">{structural_hypotheses}</text>

      <text x="16" y="344" fill="#334155">## Evaluator's Chosen Next Action</text>
      <text x="26" y="358" fill="#7c3aed">{next_action}   {proposed_hypothesis_id}</text>
    </g>

    <!-- output schema sub-box -->
    <g transform="translate(16, 372)">
      <rect width="508" height="146" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="10" y="18" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#334155">## Task — output a COMPLETE JSON object:</text>
      <text x="10" y="36" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#475569">{ "substrate": {name, sld, roughness*},</text>
      <text x="10" y="50" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#475569">  "layers": [ {name, sld, thickness, roughness,</text>
      <text x="20" y="64" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#475569">      *_min, *_max} ],  // substrate → ambient</text>
      <text x="10" y="78" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#475569">  "ambient": {name, sld, sld_min/max?},</text>
      <text x="10" y="92" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#475569">  "intensity": {value, min, max, fixed},</text>
      <text x="10" y="106" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#475569">  "sample_broadening": {..}, "theta_offset": {..},</text>
      <text x="10" y="120" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#475569">  "data_file": "{data_file}" (immutable),</text>
      <text x="10" y="134" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#475569">  "back_reflection": bool (immutable) }</text>
    </g>

    <!-- rules sub-box -->
    <g transform="translate(16, 526)">
      <rect width="508" height="98" rx="6" fill="#fefce8" stroke="#fde68a"/>
      <text x="10" y="18" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#854d0e">Rules (11): never change data_file /</text>
      <text x="10" y="32" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#854d0e">back_reflection; widen bounds that are hit;</text>
      <text x="10" y="46" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#854d0e">if next_action == structural_change → realize</text>
      <text x="10" y="60" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#854d0e">hypothesis #id, mark it "tried" + stamp iter;</text>
      <text x="10" y="74" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#854d0e">if parameter_tweak → keep stack, tune bounds.</text>
      <text x="10" y="90" font-size="10" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#9d174d">user_feedback (if any) overrides all rules.</text>
    </g>
  </g>

  <text x="820" y="846" text-anchor="middle" font-size="10" fill="#64748b">aure/nodes/prompts.py:691 MODEL_REFINEMENT_JSON_PROMPT · aure/nodes/modeling.py:118 _refine_model</text>

  <!-- Arrow: prompt -> LLM -->
  <g stroke="#334155" stroke-width="2" fill="none">
    <path d="M 1090 240 L 1150 240" marker-end="url(#arrow)"/>
  </g>

  <!-- ============================================================ -->
  <!-- Column 3: LLM + OUTPUT                                        -->
  <!-- ============================================================ -->
  <text x="1160" y="165" font-size="14" font-weight="700" fill="#64748b" letter-spacing="2">LLM CALL  &amp;  OUTPUT</text>

  <!-- LLM box -->
  <g transform="translate(1160, 180)">
    <rect width="450" height="150" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2.5" filter="url(#shadow)"/>
    <rect width="450" height="36" rx="12" fill="#d97706"/>
    <rect y="24" width="450" height="12" fill="#d97706"/>
    <text x="20" y="24" font-size="14" font-weight="700" fill="#ffffff">_refine_model()</text>
    <text x="20" y="64" font-size="12" fill="#1c1917">via <tspan font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-weight="700">aure.llm.get_llm(temperature=0)</tspan></text>
    <text x="20" y="88" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#44403c">llm.invoke([HumanMessage(content=prompt)])</text>
    <text x="20" y="112" font-size="11" fill="#78716c">_parse_model_json → _validate_model_json;</text>
    <text x="20" y="128" font-size="11" fill="#78716c">on invalid JSON → fall back to</text>
    <text x="20" y="144" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#78716c">_widen_all_bounds_json(current_model)</text>
  </g>

  <!-- arrow LLM -> JSON -->
  <line x1="1385" y1="330" x2="1385" y2="360" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- Raw JSON reply -->
  <g transform="translate(1160, 360)">
    <rect width="450" height="240" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
    <rect width="450" height="32" rx="10" fill="#334155"/>
    <rect y="22" width="450" height="10" fill="#334155"/>
    <text x="16" y="22" font-size="13" font-weight="700" fill="#ffffff">JSON reply → new ModelDefinition</text>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="11" fill="#0f172a">
      <text x="16" y="54">{</text>
      <text x="26" y="70" fill="#0369a1">"substrate": {"name":"Si","sld":2.07,...},</text>
      <text x="26" y="86" fill="#0369a1">"layers": [</text>
      <text x="36" y="102" fill="#16a34a">{"name":"Cu","thickness":500,"sld":6.55,..},</text>
      <text x="36" y="118" fill="#16a34a">{"name":"CuO","thickness":30,"sld":5.0,..}</text>
      <text x="26" y="134" fill="#0369a1">],</text>
      <text x="26" y="150" fill="#0369a1">"ambient": {"name":"D2O","sld":6.19,...},</text>
      <text x="26" y="166" fill="#0369a1">"intensity": {...}, "back_reflection": false,</text>
      <text x="26" y="182" fill="#7c3aed">"structural_hypotheses": [...]  (status-only)</text>
      <text x="16" y="198">}</text>
      <text x="16" y="222" fill="#94a3b8">immutable fields re-pinned; states + tie</text>
    </g>
  </g>

  <!-- arrow JSON -> state -->
  <line x1="1385" y1="600" x2="1385" y2="630" stroke="#334155" stroke-width="2" marker-end="url(#arrow)" fill="none"/>

  <!-- State update -->
  <g transform="translate(1160, 630)">
    <rect width="450" height="190" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
    <rect width="450" height="32" rx="10" fill="#059669"/>
    <rect y="22" width="450" height="10" fill="#059669"/>
    <text x="16" y="22" font-size="13" font-weight="700" fill="#ffffff">state update  →  fitting</text>
    <text x="16" y="52" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#0f172a">current_model = new ModelDefinition</text>
    <text x="16" y="68" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#0f172a">model_history += {iteration, changes}</text>
    <text x="16" y="84" font-size="11" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#0f172a">structural_hypotheses (status-only)</text>
    <text x="26" y="98" font-size="10" fill="#64748b">merge guard drops added/renamed entries</text>
    <text x="16" y="116" font-size="11" fill="#334155">carried over from previous model:</text>
    <text x="26" y="130" font-size="10" fill="#64748b">• data_file, back_reflection, dq_is_fwhm</text>
    <text x="26" y="144" font-size="10" fill="#64748b">• states[] + shared/unshared_parameters</text>
    <text x="26" y="158" font-size="10" fill="#64748b">  (config tie-spec wins over LLM proposal)</text>
    <text x="16" y="178" font-size="11" fill="#059669">next: model_builder.build_problem() → fit</text>
  </g>

  <!-- Footer -->
  <text x="800" y="940" text-anchor="middle" font-size="12" fill="#94a3b8">
    source: aure/nodes/modeling.py (_refine_model · _parse_model_json) · aure/nodes/prompts.py (MODEL_REFINEMENT_JSON_PROMPT) · initial build is deterministic
  </text>
</svg>
